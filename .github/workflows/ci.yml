name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {python: ["3.10", "3.12", "3.13"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: Install bubblewrap and allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --tmpfs /home -- sh -c 'test -z "$(ls -A /home)"'
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check src/grazwall tests
      - run: bandit -q -r src/grazwall -c bandit.yaml -ll
      - run: pipx run pip-audit
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with: {target: "python demo/safe_server.py", fail-on: medium, version: "."}
