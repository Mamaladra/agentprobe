name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {python: ["3.10", "3.12", "3.13"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: sudo apt-get install -y -qq bubblewrap && (sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true)
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check src/agentprobe tests
      - run: bandit -q -r src/agentprobe -c bandit.yaml -ll
      - run: pipx run pip-audit
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with: {target: "python demo/safe_server.py", fail-on: medium, version: "."}
