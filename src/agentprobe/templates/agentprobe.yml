# GitHub Action: AgentProbe CI gate. Fails the build on high/critical findings.
name: agentprobe
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install agentprobe   # pre-release: pip install git+<repo-url>
      - run: agentprobe scan "python server.py" --json agentprobe.json --html agentprobe.html --fail-on high --min-score 75
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: agentprobe-report, path: "agentprobe.*"}
